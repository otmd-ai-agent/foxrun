services:
  demo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/foxrun:cached
    environment:
      FOXRUN_DEMO_ROOT: /tmp/foxrun-demo
      MODEL_RUNNER_HOST: http://model-runner:12434
      NO_PROXY: localhost,127.0.0.1,model-runner
      no_proxy: localhost,127.0.0.1,model-runner
    depends_on:
      model-runner:
        condition: service_healthy
  model-runner:
    image: docker/model-runner@sha256:60e6a14d8cc331fab3e51d7b78bba98274b4d28573f4e0b345e475d52d167869
    environment:
      LLAMA_ARGS: --ctx-size 4096 --threads 4 --threads-batch 4 --n-gpu-layers 0 --jinja
      DO_NOT_TRACK: "1"
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12434/engines/status"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  model-cache:
